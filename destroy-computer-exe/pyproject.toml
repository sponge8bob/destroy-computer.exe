[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terdle"
version = "0.1.0"
description = "Terminal DLE games — Wordle and more"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
terdle = "terdle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/terdle"]
